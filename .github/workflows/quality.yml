name: Quality

on:
  pull_request:
  push:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      # Node 22 ships npm 10, which ignores package.json#allowScripts; npm 11 honours it.
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run format:check && npm test
      - name: Prove sync canonical order is locale independent
        run: |
          LANG=da_DK.UTF-8 LC_ALL=da_DK.UTF-8 npx vitest run test/sync-state.test.ts
          LANG=cs_CZ.UTF-8 LC_ALL=cs_CZ.UTF-8 npx vitest run test/sync-state.test.ts
      - run: npm run test:omarchy
      - run: npm run check:desktop-contract
      - run: npm run check:omarchy-mirror -- --warn
      - run: npm audit --omit=dev --audit-level=high

  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Build reproducible private runtime
        run: >-
          node scripts/build-runtime-bundle.mjs
          --target "${{ matrix.target }}"
          --output "$RUNNER_TEMP/runtime"
      - name: Verify target, manifest, inventory and archive
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/check-runtime-bundle.mjs \
            "$RUNNER_TEMP/runtime/pimpampum-runtime-$version-${{ matrix.target }}" \
            --target "${{ matrix.target }}" \
            --lockfile package-lock.json
      - name: Smoke with an empty external PATH
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          payload="$RUNNER_TEMP/runtime/pimpampum-runtime-$version-${{ matrix.target }}/payload"
          mkdir -p "$RUNNER_TEMP/runtime-home"
          env -i HOME="$RUNNER_TEMP/runtime-home" PATH= \
            "$payload/bin/node" "$payload/dist/cli.js" --version
          (
            cd "$payload"
            env -i HOME="$RUNNER_TEMP/runtime-home" PATH= \
              "$payload/bin/node" --input-type=module --eval \
              "import Database from 'better-sqlite3'; const db=new Database(':memory:'); db.prepare('select 1').get(); db.close();"
          )
      - name: Exercise the packaged shape on a simulated Omarchy host
        if: matrix.target != 'darwin-arm64'
        run: >-
          node scripts/check-packaged-delivery.mjs
          "$RUNNER_TEMP/runtime"
          --target "${{ matrix.target }}"
      - name: Pack mode-preserving runtime transport
        run: |
          version=$(node -p "require('./package.json').version")
          bundle="pimpampum-runtime-$version-${{ matrix.target }}"
          /usr/bin/tar -czf "$RUNNER_TEMP/runtime-${{ matrix.target }}.tar.gz" \
            -C "$RUNNER_TEMP/runtime" "$bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ matrix.target }}
          path: ${{ runner.temp }}/runtime-${{ matrix.target }}.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  runtime-manifest:
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runtime-linux-*
          path: ${{ runner.temp }}/runtime-review
          merge-multiple: true
      - name: Unpack exact Linux runtime transports
        run: |
          for target in linux-arm64 linux-x64; do
            /usr/bin/tar -xzf "$RUNNER_TEMP/runtime-review/runtime-$target.tar.gz" \
              -C "$RUNNER_TEMP/runtime-review"
          done
      - name: Match reviewed Omarchy pins to exact release archives
        run: |
          node scripts/check-reviewed-runtime-manifest.mjs "$RUNNER_TEMP/runtime-review" \
            --output "$RUNNER_TEMP/generated-runtime-manifest.json"
      # On a mismatch this file carries the digests to pin; CI reproduces them, a laptop does not.
      - name: Upload the generated runtime manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-runtime-manifest
          path: ${{ runner.temp }}/generated-runtime-manifest.json
          if-no-files-found: warn
          retention-days: 30

  macos:
    needs: runtime
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run test:macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-darwin-arm64
          path: ${{ runner.temp }}/runtime-darwin-arm64
      - name: Unpack mode-preserving runtime transport
        run: |
          /usr/bin/tar -xzf "$RUNNER_TEMP/runtime-darwin-arm64/runtime-darwin-arm64.tar.gz" \
            -C "$RUNNER_TEMP/runtime-darwin-arm64"
      - name: Build app with the reviewed runtime
        run: |
          version=$(node -p "require('./package.json').version")
          PIMPAMPUM_RUNTIME_BUNDLE="$RUNNER_TEMP/runtime-darwin-arm64/pimpampum-runtime-$version-darwin-arm64" \
            npm run build:macos
      # With the app and its 150 MB runtime present on disk, prove that neither reaches npm.
      - name: Gate the npm package size and contents
        run: npm run check:package-size
      - name: Exercise the complete macOS lifecycle before release
        env:
          TMPDIR: ${{ runner.temp }}/macos-live
        run: |
          mkdir -p "$TMPDIR"
          node scripts/check-macos-artifact.mjs \
            platforms/macos/dist/Pimpampum.app --approve
          PIMPAMPUM_RUN_LIVE_MACOS=1 npm run test:e2e:macos
      - name: Upload live-smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-pr-live-smoke-diagnostics
          path: ${{ runner.temp }}/macos-live
          if-no-files-found: warn
          retention-days: 7

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm install --global npm@11
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
