name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --eval "const expected='v'+require('./package.json').version;if(process.env.RELEASE_TAG!==expected)throw new Error('Tag '+process.env.RELEASE_TAG+' must equal '+expected)"
      - run: npm run typecheck && npm run lint && npm run format:check && npm test
      - run: npm run test:evals
      - run: npm run test:omarchy
      - run: npm run check:desktop-contract
      - run: npm audit --omit=dev

  publish:
    needs: validate
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run test:macos
      - run: npm run build:macos
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/pimpampum-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Sign final app
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: /usr/bin/codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" platforms/macos/dist/PimpampumMenuBar.app
      - name: Approve and exercise the exact signed artifact
        env:
          # The live smoke creates its data directory, daemon logs, and login-item
          # acknowledgements under os.tmpdir(); pin it so a failure can be uploaded.
          TMPDIR: ${{ runner.temp }}/macos-live
        run: |
          mkdir -p "$TMPDIR"
          node scripts/check-macos-artifact.mjs platforms/macos/dist/PimpampumMenuBar.app --approve
          PIMPAMPUM_RUN_LIVE_MACOS=1 npm run test:e2e:macos
          npm run check:macos-evidence
      - name: Upload live-smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-live-smoke-diagnostics
          path: ${{ runner.temp }}/macos-live
          if-no-files-found: warn
          retention-days: 7
      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          submission="$RUNNER_TEMP/PimpampumMenuBar-notarization.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent platforms/macos/dist/PimpampumMenuBar.app "$submission"
          xcrun notarytool submit "$submission" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple platforms/macos/dist/PimpampumMenuBar.app
          scripts/check-macos-distribution.sh
      - name: Build release assets
        run: scripts/package-release-assets.sh "$RUNNER_TEMP/release"
      - name: Publish npm package with provenance
        run: |
          npm install --global npm@11
          npm publish "$RUNNER_TEMP/release/pimpampum-${GITHUB_REF_NAME#v}.tgz" --access public --provenance
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/pimpampum-${GITHUB_REF_NAME#v}.tgz" \
            "$RUNNER_TEMP/release/PimpampumMenuBar-${GITHUB_REF_NAME#v}-macos-arm64.zip" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            --generate-notes \
            --verify-tag
